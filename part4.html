  <main>
    <h1>Part 4. Mini Project — Task 8. To-Do List</h1>

    <div class="todo-layout">
      <!-- Left column: list of tasks -->
      <section>
        <h2>To-do list</h2>
        <p id="emptyText" class="hint">No tasks yet. Add your first task.</p>
        <ul id="taskList"></ul>
      </section>

      <!-- Right column: form to add a task -->
      <section>
        <h2>Add new task</h2>
        <div class="todo-form">
          <label for="titleInput">* Title</label>
          <input type="text" id="titleInput">

          <label for="descInput">* Description</label>
          <textarea id="descInput" rows="6"></textarea>

          <p id="errorText"></p>
          <button id="addTaskBtn">Add Task</button>
        </div>
      </section>
    </div>
